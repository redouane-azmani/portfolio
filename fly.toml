# Configuration Fly.io pour le CV de Redouane AZMANI
app = 'cv-redouane-azmani'
primary_region = 'cdg'  # Paris, France

[build]

[env]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/cv.html'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256 